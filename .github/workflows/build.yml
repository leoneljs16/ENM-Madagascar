name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4.2.2

      - name: Installer le JDK 17
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurer le SDK Android
        uses: android-actions/setup-android@v3.2.2

      - name: Installer les composants Android
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Installer Gradle 8.10.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Tests unitaires
        run: gradle --no-daemon testDebugUnitTest

      - name: Analyse lint
        run: gradle --no-daemon lintDebug

      - name: Compiler l’APK de débogage
        run: gradle --no-daemon assembleDebug

      - name: Publier l’APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ENM-Madagascar-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publier les rapports en cas d’échec
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: rapports-de-build
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Aide en cas d’échec
        if: failure()
        run: |
          {
            echo "## Le build a échoué"
            echo "1. Ouvre l'étape en rouge ci-dessus et lis les dernières lignes (cherche « error » ou « FAILED »)."
            echo "2. Vérifie que chaque fichier est au bon chemin et collé en entier."
            echo "3. Télécharge l'artefact « rapports-de-build » pour les détails des tests et du lint."
            echo "4. Copie le message d'erreur et envoie-le pour obtenir un correctif."
          } >> "$GITHUB_STEP_SUMMARY"
